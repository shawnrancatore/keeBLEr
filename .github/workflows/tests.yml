# SPDX-License-Identifier: MIT
# Host-side tests: the firmware's pure C, and the web app's DOM-free logic.

name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'web/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'web/**'
      - '.github/workflows/tests.yml'

jobs:
  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/test/host test

  web:
    name: Web logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: web
